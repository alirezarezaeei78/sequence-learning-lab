name: Cell arithmetic checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4
      - run: python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest -v
      - run: python tutorial.py --output /tmp/lstm-example.json
      - run: python compare_cells.py --output /tmp/cell-comparison.json
      - run: python padding_demo.py --output /tmp/padding-example.json
